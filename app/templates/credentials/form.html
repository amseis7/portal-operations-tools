{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        {% if credential %} Editar Credencial {% else %} Nueva Credencial {% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Grupo</label>
                            <div class="input-group">
                                <select name="group_id" class="form-select" id="groupSelect">
                                    <option value="" disabled {% if not credential %}selected{% endif %}>Selecciona un
                                        grupo...</option>
                                    {% for group in groups %}
                                    <option value="{{ group.id }}" {% if credential and credential.group_id==group.id
                                        %}selected{% endif %}>
                                        {{ group.name }}
                                    </option>
                                    {% endfor %}
                                    <option value="NEW">+ Crear Nuevo Grupo</option>
                                </select>
                                <input type="text" name="new_group_name" id="newGroupInput" class="form-control d-none"
                                    placeholder="Nombre del nuevo grupo">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Título (Ej: Router Piso 1)</label>
                            <input type="text" name="title" class="form-control"
                                value="{{ credential.title if credential else '' }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Usuario / Email</label>
                                <input type="text" name="username" class="form-control"
                                    value="{{ credential.username if credential else '' }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contraseña</label>
                                <div class="input-group">
                                    <input type="password" name="password" id="passwordField"
                                        class="form-control font-monospace"
                                        placeholder="{% if credential %}Dejar en blanco para mantener la actual{% endif %}"
                                        {% if not credential %}required{% endif %}>

                                    <button class="btn btn-outline-secondary" type="button" onclick="toggleVisibility()"
                                        title="Ver/Ocultar">
                                        <i class="bi bi-eye" id="toggleIcon"></i>
                                    </button>

                                    <button class="btn btn-outline-primary" type="button" onclick="generatePassword()"
                                        title="Generar contraseña segura">
                                        <i class="bi bi-shuffle"></i> Generar
                                    </button>
                                </div>
                                <div class="progress mt-1" style="height: 5px;">
                                    <div id="strengthBar" class="progress-bar" role="progressbar" style="width: 0%">
                                    </div>
                                </div>
                                <small class="text-muted" style="font-size: 0.8rem;">Min 8 chars, mayúsculas, números y
                                    símbolos.</small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL (Opcional)</label>
                            <input type="url" name="url" class="form-control"
                                value="{{ credential.url if credential else '' }}" placeholder="https://...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Notas</label>
                            <textarea name="notes" class="form-control"
                                rows="3">{{ credential.notes if credential else '' }}</textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('credentials.index') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Credencial</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const groupSelect = document.getElementById('groupSelect');
    const newGroupInput = document.getElementById('newGroupInput');
    const passwordField = document.getElementById("passwordField");

    // Lógica para mostrar input de nuevo grupo
    groupSelect.addEventListener('change', function () {
        if (this.value === 'NEW') {
            newGroupInput.classList.remove('d-none');
            newGroupInput.required = true;
            this.name = "";
        } else {
            newGroupInput.classList.add('d-none');
            newGroupInput.required = false;
            this.name = "group_id";
        }
    });

    // Lógica de Barra de Fortaleza
    passwordField.addEventListener('input', function () {
        const val = this.value;
        const bar = document.getElementById('strengthBar');
        let strength = 0;

        if (val.length === 0) { bar.style.width = '0%'; return; }

        if (val.length >= 8) strength += 25;
        if (val.match(/[A-Z]/)) strength += 25;
        if (val.match(/[0-9]/)) strength += 25;
        if (val.match(/[^a-zA-Z0-9]/)) strength += 25; // Símbolos

        bar.style.width = strength + '%';

        // Colores según fortaleza
        if (strength <= 25) { bar.className = "progress-bar bg-danger"; }
        else if (strength <= 50) { bar.className = "progress-bar bg-warning"; }
        else if (strength <= 75) { bar.className = "progress-bar bg-info"; }
        else { bar.className = "progress-bar bg-success"; }
    });

    function generatePassword() {
        const length = 20;
        const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
        let retVal = "";
        for (let i = 0, n = charset.length; i < length; ++i) {
            retVal += charset.charAt(Math.floor(Math.random() * n));
        }

        passwordField.value = retVal;
        passwordField.type = "text"; // Mostrar para que el usuario vea
        document.getElementById("toggleIcon").className = "bi bi-eye-slash";

        // Disparar evento input manualmente para actualizar la barra
        passwordField.dispatchEvent(new Event('input'));
    }

    function toggleVisibility() {
        const icon = document.getElementById("toggleIcon");
        if (passwordField.type === "password") {
            passwordField.type = "text";
            icon.className = "bi bi-eye-slash";
        } else {
            passwordField.type = "password";
            icon.className = "bi bi-eye";
        }
    }
</script>
{% endblock %}
