{% extends "base.html" %}
{% block title %}Iniciar Sesión — Portal de Operaciones{% endblock %}

{% block content %}
<div class="card card-login shadow">
  <div class="card-body p-4">

    <div class="text-center mb-4">
      <i class="bi bi-shield-lock-fill login-brand-icon"></i>
      <h4 class="mt-2 mb-0 fw-semibold">Portal de Operaciones</h4>
      <small class="text-muted">DEFENSE CENTER</small>
    </div>

    <form action="" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="username" name="username" required autofocus
               autocomplete="username">
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password" required
                 autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                  tabindex="-1" aria-label="Mostrar u ocultar contraseña">
            <i class="bi bi-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  document.getElementById('togglePassword').addEventListener('click', function () {
    const pwd  = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    const isHidden = pwd.type === 'password';
    pwd.type       = isHidden ? 'text' : 'password';
    icon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
</script>
{% endblock %}
